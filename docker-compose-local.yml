version: '3.8'

services:
  app:
    # image: tsh11na/tsukepp:latest
    build:
      context: .
      dockerfile: Dockerfile.local

    # Overrides default command so things don't shut down after the process ends.
    command: sleep infinity

    # environment:
    #   PGSERVICEFILE: /workspaces/.pg_service.conf
    #   PGPASSFILE: /workspaces/.pgpass

    ports:
      - 8010:8010

    depends_on:
      - db

  db:
    image: postgres:latest
    restart: unless-stopped
    volumes:
      - postgres-data:/var/lib/postgresql/data
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # Use 5432:5432 to forward PostgreSQL locally.
    ports:
      - 5432:5432

volumes:
  postgres-data:
